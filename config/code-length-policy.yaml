# 代码长度门禁策略配置
# 阈值取自代码健康重构冲刺公共要求表格中的硬上限

thresholds:
  files:
    ts: 500
    tsx: 300
    css: 300
  functions:
    ts: 50
    tsx: 80

include:
  - "src/**/*.{ts,tsx,css}"
  - "scripts/**/*.{ts,tsx,css}"

exclude:
  - "src/core/prompts/**"
  - "test/fixtures/**"
  - ".next/**"
  - "node_modules/**"
  - "dist/**"

# 豁免清单：暂时无法达标的对象，每项写明 path、可选 symbol、临时上限 limit 与原因 reason；
# 对象达标后检查器会提示移除。
allowlist: []
