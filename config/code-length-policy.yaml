# 代码长度门禁策略配置
# 阈值取自代码健康重构冲刺公共要求表格中的硬上限

thresholds:
  files:
    ts: 500
    tsx: 300
    css: 300
  functions:
    ts: 50
    tsx: 80

include:
  - "src/**/*.{ts,tsx,css}"
  - "scripts/**/*.{ts,tsx,css}"

exclude:
  - "src/core/prompts/**"
  - "test/fixtures/**"
  - ".next/**"
  - "node_modules/**"
  - "dist/**"

# 临时豁免清单：尚未由其它并行任务包重构的对象
# 其它四个并行包合并后，主代理会统一删掉已达标的豁免项
allowlist:
  # --- 其他工作包负责对象 ---
  - path: "src/core/prompt.ts"
    limit: 1000
    reason: "WP-E 任务包重构对象"
