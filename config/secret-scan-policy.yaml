# 发布前密钥扫描（pnpm check:secrets）的策略：扫描 git 已跟踪的文本文件。
# 规则与数据仓发布共用（src/core/sync/leak-scan.ts 的私钥块与厂商令牌），另加「赋值启发」：
# apiKey / secret / token / password 之类的键后面跟着的长随机串。

# 不扫描的路径：以 / 结尾按前缀匹配，否则精确匹配
ignore:
  - pnpm-lock.yaml
  - docs/ui/screenshots/

# 含有假令牌的文件（测试夹具、文档示例），逐个登记并写明原因；新增条目须说明为什么不是真密钥
allow:
  - path: test/bin/sync-data.test.ts
    reason: 私钥块起始行作为泄漏规则的测试输入
  - path: test/core/github-auth/github-auth.test.ts
    reason: 截断的假 PEM，测试 GitHub App 凭据写入
  - path: test/core/sync/export-run.test.ts
    reason: 假 ghp_ 令牌，测试 run.json 命中令牌时整轮拒发
  - path: test/core/sync/leak-scan.test.ts
    reason: 泄漏规则自身的正反例
  - path: src/core/sync/leak-scan.ts
    reason: 私钥块规则的正则源码本身含有 BEGIN PRIVATE KEY 字样
  - path: test/core/leak-guard.test.ts
    reason: 假的 sk-test 令牌，测试凭据指纹比对
  - path: test/core/sync/orchestrator-skipped.test.ts
    reason: 假私钥块，测试命中泄漏规则的轮次被跳过

# 任何情况下都不该出现在版本库里的路径；出现即失败
forbidden:
  - config/pelican.config.yaml
  - config/pelican.config.yaml.staging
  - data/
  - .env
  - .env.local
