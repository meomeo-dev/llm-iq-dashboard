<div class="stack"><div class="field-row"><label title="按模型分道：不同模型并行，同一模型的各强度串行">同时在跑的模型数<input type="number" min="1" value="2"/></label><label>全局默认超时（秒）<input type="number" min="1" value="600"/></label></div><div class="timeout-section-head"><div class="timeout-section-title"><strong>按思考强度分段超时</strong><span class="note">high 及以下 600 秒，high 以上 1800 秒（优先于 CLI 与默认超时）</span></div><button type="button" class="btn-preset">⚡ 一键填充推荐分段（≤high 600s / &gt;high 1800s）</button></div><div class="timeout-tier-card"><div class="tier-header"><span class="tier-badge low">high 及以下档位</span><span class="note">思考耗时适中，建议 600 秒（10 分钟）</span></div><div class="field-row"><label title="轻度思考">low (低) 超时（秒）<input type="number" min="1" placeholder="推荐 600" value="600"/></label><label title="标准思考">medium (中) 超时（秒）<input type="number" min="1" placeholder="推荐 600" value=""/></label><label title="深度思考">high (高) 超时（秒）<input type="number" min="1" placeholder="推荐 600" value="900"/></label></div></div><div class="timeout-tier-card highlight-tier"><div class="tier-header"><span class="tier-badge high">high 以上档位 (xhigh / max / ultra)</span><span class="note">深度思考极其耗时，建议 1800 秒（30 分钟）避免被误判中断</span></div><div class="field-row"><label title="强化深度思考">xhigh (极高) 超时（秒）<input type="number" min="1" placeholder="推荐 1800" value="1800"/></label><label title="极限思考">max (最大) 超时（秒）<input type="number" min="1" placeholder="推荐 1800" value=""/></label><label title="极限超长思考">ultra (超级) 超时（秒）<input type="number" min="1" placeholder="推荐 1800" value=""/></label></div></div><div class="timeout-section-head" style="margin-top:8px"><div class="timeout-section-title"><strong>按 CLI 覆盖超时（秒）</strong><span class="note">仅在未指定该强度超时时生效</span></div></div><div class="field-row"><label>claude 默认（秒）<input type="number" min="1" placeholder="默认 600" value="900"/></label><label>codex 默认（秒）<input type="number" min="1" placeholder="默认 600" value="300"/></label><label>agy 默认（秒）<input type="number" min="1" placeholder="默认 600" value=""/></label></div><p class="note">优先级：单个目标的 timeoutMs &gt; 按强度的设置（run.timeoutByEffort）&gt; 该 CLI 的设置 &gt; 全局默认。超时会终止整个进程组，不会留下继续占用配额的孤儿进程。</p></div>
